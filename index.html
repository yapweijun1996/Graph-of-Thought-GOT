<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph-of-Thought Visualizer</title>

    <!-- SEO + social preview metadata (13.1) -->
    <meta
      name="description"
      content="Graph-of-Thought turns a question into an interactive AI reasoning graph — independent branches that converge on shared conclusions."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Graph-of-Thought Visualizer" />
    <meta
      property="og:description"
      content="Turn a question into an interactive AI reasoning graph — independent branches that converge into a Graph-of-Thought."
    />
    <meta
      property="og:image"
      content="https://yapweijun1996.github.io/Graph-of-Thought-GOT/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA manifest (13.4) -->
    <link rel="manifest" href="manifest.json" />
    <script>
      // pre-paint theme so there is no flash of the wrong mode before React loads
      try {
        var p = JSON.parse(localStorage.getItem('got:prefs') || 'null');
        var t = p && p.state && p.state.theme;
        if (
          t === 'dark' ||
          (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <!-- agrun.js UMD bundle — exposes window.Agrun (LLM transport layer).
         `defer` keeps the 3MB bundle from blocking first paint; window.Agrun
         is only read lazily at call time, well after load (11.4). -->
    <script src="./agrun.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
